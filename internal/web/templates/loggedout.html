{{template "bare" .}}
{{define "content"}}
<div class="centered">
  <section class="card signed-out">
    <h1>You've signed out</h1>
    {{$partial := false}}{{range .Logout}}{{if not (and .LoggedOut .Revoked)}}{{$partial = true}}{{end}}{{end}}
    {{if $partial}}<p class="muted">Some sessions couldn't be closed and will expire on their own.</p>{{end}}
    <p><a class="btn btn-primary" href="/">Sign in again</a></p>
  </section>
</div>
{{end}}
