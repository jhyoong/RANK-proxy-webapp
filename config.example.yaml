# Example portal configuration. Copy, edit and mount at /etc/portal/config.yaml
# (or pass -config / PORTAL_CONFIG). Placeholder hosts only; no secrets belong here.

# Address the portal listens on.
listen: ":8080"

# Add the Secure attribute to the session cookie. Keep true; set false only
# when testing over plain HTTP on a hostname other than localhost.
cookie_secure: true

# Optional HTTPS on the portal itself. Leave both empty when TLS ends at an
# ingress or when testing through kubectl port-forward.
tls:
  cert_file: ""
  key_file: ""

session:
  # Session ends after this long without a request.
  idle_timeout: 30m
  # Session ends this long after login, regardless of activity. Also sent to
  # Rancher as the requested token lifetime (ttl).
  absolute_timeout: 8h
  # Most live sessions per user. A further login ends the oldest one and
  # revokes its Rancher tokens.
  max_per_user: 5

login:
  # Timeout for each request to a Rancher site.
  timeout: 15s
  # Login attempts allowed per username and per client IP within
  # attempt_window (0 or unset uses the default; negative is rejected). A
  # blocked login makes no call to Rancher. Keep max_attempts_per_user below
  # the AD lockout threshold minus the attempts people make in the Rancher UI
  # directly. attempt_window should be at least AD's lockout observation
  # window; it restarts at each counted attempt.
  max_attempts_per_user: 3
  max_attempts_per_ip: 20
  attempt_window: 15m
  # CIDRs of reverse proxies whose X-Forwarded-For header is trusted for the
  # client IP. Set this to the ingress controller's pod CIDR; without it every
  # user behind the ingress shares one IP bucket.
  trusted_proxies: []

# Rancher sites. Order matters: the first site is tried first at login, and a
# rejected password there stops the login (one AD attempt per portal login).
# url: https only, no path. ca_file: PEM bundle for that site's certificate;
# leave empty to use the image's system roots.
sites:
  - name: site-1
    url: https://rancher-1.example.internal
    ca_file: /etc/portal/ca/site-1.pem
  - name: site-2
    url: https://rancher-2.example.internal
    ca_file: /etc/portal/ca/site-2.pem
  - name: site-3
    url: https://rancher-3.example.internal
    ca_file: /etc/portal/ca/site-3.pem

# Where kagent lives in each downstream cluster. These values become URL path
# segments, so none may contain "/", "?" or "#". Defaults shown, except
# agent_name, which is required: the name of the deployed kagent agent.
kagent:
  namespace: kagent
  service: http:kagent-controller:8083
  agent_namespace: kagent
  agent_name: <agent-name>

clusters:
  # How long a session's cluster list is cached.
  cache_ttl: 2m
  # List each site's "local" management cluster (hidden by default). Turn on
  # only where kagent is deployed in the local cluster.
  include_local: false

api:
  # Timeout for each cluster list / check request to Rancher.
  timeout: 15s

chat:
  max_duration: 30m        # total cap per reply; matches kagent's streaming timeout on site (Helm default is 10m)
  idle_timeout: 10m        # cap on silence between upstream events (kagent sends no heartbeats);
                           # an ingress without timeout annotations cuts silence at 60s first
  max_message_bytes: 8192  # longest message a user can send (1 to 65536)
  heartbeat: 15s           # comment line sent to the browser while upstream is silent
  log_events: false        # log the shape (never content) of every upstream event; on for live tests

ui:
  # Announcement at the top of the login page. Plain text, one line, max 300 characters.
  banner: ""
  # Banner style: info (blue) or warning (amber). Default info.
  banner_level: info
  # Help box on the login page, max 2000 characters. Plain text; blank lines
  # separate paragraphs; http(s) URLs and email addresses become links.
  login_help: ""
  # Support contact (bare address) shown on the login page, the unavailable
  # screen, error messages and the user menu, as a mailto: link.
  support_email: ""
