# Example manifests for the live test (login flow, cluster list, kagent check).
# Replace every <placeholder>. No secrets live here: the portal holds no
# credentials of its own; users' Rancher tokens stay in pod memory.
#
#   kubectl apply -f deploy/portal.yaml
#   kubectl -n kagent-portal port-forward svc/portal 8080:80
#   open http://localhost:8080   (localhost counts as a secure context, so
#                                 Secure cookies work over plain HTTP)
apiVersion: v1
kind: Namespace
metadata:
  name: kagent-portal
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-config
  namespace: kagent-portal
data:
  config.yaml: |
    listen: ":8080"
    # Keep true for port-forward to localhost. Set false ONLY if testing over
    # plain HTTP on a non-localhost name (browsers drop Secure cookies there).
    cookie_secure: true
    session:
      idle_timeout: 30m
      absolute_timeout: 8h
      max_per_user: 5
    login:
      timeout: 15s
      # Keep max_attempts_per_user below the AD lockout threshold minus
      # attempts made in the Rancher UI directly. attempt_window should be at
      # least AD's lockout observation window.
      max_attempts_per_user: 3
      max_attempts_per_ip: 20
      attempt_window: 15m
      # Ingress controller's pod CIDR, so X-Forwarded-For is trusted only from it.
      trusted_proxies: [<ingress-pod-cidr>]
    # Where kagent lives in each downstream cluster (URL path segments: no
    # "/", "?" or "#"). Defaults shown, except agent_name (required: the deployed kagent agent's name).
    kagent:
      namespace: kagent
      service: http:kagent-controller:8083
      agent_namespace: kagent
      agent_name: <agent-name>
    clusters:
      cache_ttl: 2m
      # true only if kagent runs in a site's "local" cluster (hidden otherwise).
      include_local: false
    api:
      timeout: 15s
    # Chat with the kagent agent. log_events logs the shape (never the
    # content) of every upstream event: keep it on for the live test.
    chat:
      max_duration: 30m
      idle_timeout: 10m
      max_message_bytes: 8192
      heartbeat: 15s
      log_events: true
    sites:
      - name: <site-1-name>
        url: https://<rancher-site-1-host>
        ca_file: /etc/portal/ca/site-1.pem
      - name: <site-2-name>
        url: https://<rancher-site-2-host>
        ca_file: /etc/portal/ca/site-2.pem
      - name: <site-3-name>
        url: https://<rancher-site-3-host>
        ca_file: /etc/portal/ca/site-3.pem
  # Full CA chain (PEM) that signs each Rancher site's certificate.
  site-1.pem: |
    -----BEGIN CERTIFICATE-----
    <site-1 CA>
    -----END CERTIFICATE-----
  site-2.pem: |
    -----BEGIN CERTIFICATE-----
    <site-2 CA>
    -----END CERTIFICATE-----
  site-3.pem: |
    -----BEGIN CERTIFICATE-----
    <site-3 CA>
    -----END CERTIFICATE-----
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: kagent-portal
  labels: {app: portal}
spec:
  replicas: 1 # in-memory sessions: must stay at 1 (sessions live in memory)
  selector:
    matchLabels: {app: portal}
  template:
    metadata:
      labels: {app: portal}
    spec:
      # Shutdown needs up to 25s: a 15s HTTP drain, then a 10s pass revoking
      # every live session's Rancher tokens. 30s is the Kubernetes default; it
      # is set explicitly so it is not lowered below what shutdown needs.
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: portal
          image: <internal-registry>/rank-proxy-webapp@sha256:<digest>
          args: ["-config", "/etc/portal/config.yaml"]
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/portal, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: portal-config
            items:
              - {key: config.yaml, path: config.yaml}
              - {key: site-1.pem, path: ca/site-1.pem}
              - {key: site-2.pem, path: ca/site-2.pem}
              - {key: site-3.pem, path: ca/site-3.pem}
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: kagent-portal
spec:
  selector: {app: portal}
  ports:
    - {name: http, port: 80, targetPort: http}
---
# Default-deny for the portal pod, with only the flows it needs. Placeholders:
# <ingress-controller-namespace> and each <rancher-site-N-cidr>.
# Note: during a `kubectl port-forward` live test, port-forward goes through the
# kubelet and is not subject to NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portal
  namespace: kagent-portal
spec:
  podSelector:
    matchLabels: {app: portal}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: <ingress-controller-namespace>
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - ipBlock: {cidr: <rancher-site-1-cidr>}
        - ipBlock: {cidr: <rancher-site-2-cidr>}
        - ipBlock: {cidr: <rancher-site-3-cidr>}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
